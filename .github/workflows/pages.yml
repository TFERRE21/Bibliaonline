name: Gerar e atualizar biblioteca editorial
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 9,21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: editorial-content
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Reaproveitar Bíblia já importada
        uses: actions/cache@v4
        with:
          path: public/biblia/pt
          key: bpm-corpus-v1
      - name: Importar Bíblia Portuguesa Mundial para arquivos locais
        run: npm run bible:import
      - name: Gerar biblioteca e páginas
        env:
          SITE_URL: https://conectabiblia.com.br
        run: npm run content:build
      - name: Publicar próximo conteúdo editorial
        env:
          SITE_URL: https://conectabiblia.com.br
        run: npm run content:publish
      - name: Verificar arquivos publicados
        run: |
          test -f public/index.html
          test -f public/404.html
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/conteudo/index.html
          grep -q "https://conectabiblia.com.br/sitemap.xml" public/robots.txt
      - name: Persistir estado editorial para a próxima execução
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content-library.json data/publication-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza conteúdo editorial automático"
            git push
          else
            echo "Sem alterações no estado editorial."
          fi
