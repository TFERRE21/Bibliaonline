name: Validar motor editorial
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verificar sintaxe
        run: |
          node --check server.js
          node --check scripts/content-engine.js
          node --check scripts/import-bible.js
          node --check scripts/generate-verse-pages.js
          node --check scripts/generate-devotional-plan.js
          node --check scripts/generate-topic-pages.js
          node --check theme.js
          node --check service-worker.js
          node --check app.js
          node --check layout-home.js
          node --input-type=module --check < account-client.js
          node --input-type=module --check < account.js
          node -e "JSON.parse(require('fs').readFileSync('data/content-library.json','utf8'))"
      - name: Gerar biblioteca completa em ambiente de teste
        run: |
          SITE_URL=https://example.test npm run content:build
          test -f public/index.html
          test -f public/ferramentas.html
          test -f public/conteudo/index.html
          test -f public/sitemap.xml
          test -f public/plano-365.html
          test -f public/data/devotional-plan-365.json
          test -f public/devocionais/index.html
          test -f public/devocionais/dia-1/index.html
          test -f public/devocionais/dia-365/index.html
          grep -q 'devocionais/dia-365' public/sitemap.xml
          test -f public/assuntos/index.html
          test -f public/assuntos/ansiedade-e-preocupacao/index.html
          grep -q 'assuntos/ansiedade-e-preocupacao' public/sitemap.xml
          node -e "const p=require('./data/devotional-plan-365.json');if(p.days.length!==365)throw Error('Plano anual incompleto')"
          test -f public/robots.txt
          test -f public/404.html
          grep -q 'noindex,nofollow' conta.html
          ! grep -q 'bibliaonline.vps11710.panel.icontainer.work' account.js
          mkdir -p public/assets/arte
          test -d public/assets/arte
          grep -q "https://example.test/" public/sitemap.xml
          grep -q "https://example.test/sitemap.xml" public/robots.txt
      - name: Verificar publicação diária sem API
        run: |
          node -e "const fs=require('fs');const lib=JSON.parse(fs.readFileSync('data/content-library.json'));const target='guia-amizade-e-lealdade';if(!lib.some(x=>x.id===target))throw Error('Fixture editorial ausente');fs.writeFileSync('data/publication-state.json',JSON.stringify({publishedIds:lib.filter(x=>x.id!==target).map(x=>x.id)},null,2));"
          SITE_URL=https://example.test npm run content:publish
          test -f public/conteudo/guia-amizade-e-lealdade/index.html
          grep -q 'guia-amizade-e-lealdade' public/sitemap.xml
          ! grep -q 'api.openai.com' scripts/content-engine.js
          ! grep -q 'bible-api.com' app.js
          grep -q 'biblia/pt/' app.js
