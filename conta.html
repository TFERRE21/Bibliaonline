<style>
.account-wrap{max-width:850px;margin:44px auto;padding:0 18px}.account-card{background:var(--card,#fff);border:1px solid #dce5ee;border-radius:18px;padding:26px;box-shadow:0 12px 35px #102b4510}.account-card h1{margin:0 0 8px;color:#173b59}.account-card p{color:#64748b}.account-form{display:grid;gap:13px;max-width:480px}.account-form label,.note-form label{display:grid;gap:6px;font-weight:600;color:#28445d}.account-form input,.note-form input,.note-form textarea{width:100%;padding:12px;border:1px solid #ccd8e3;border-radius:10px;font:inherit}.account-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.account-message{margin:12px 0;padding:11px;border-radius:9px;background:#edf5fb;color:#173b59}.account-message.error{background:#fff0f0;color:#9b2525}.note-form{display:grid;gap:12px;margin:18px 0}.note-form textarea{min-height:125px;resize:vertical}.note-list{display:grid;gap:12px;margin-top:20px}.note-item{border:1px solid #dce5ee;border-radius:12px;padding:16px}.note-item h3{margin:0 0 6px;color:#173b59}.note-item p{white-space:pre-wrap;overflow-wrap:anywhere}.note-meta{font-size:12px;color:#718096}.note-buttons{display:flex;gap:8px}.saved-library{margin-top:34px;padding-top:22px;border-top:1px solid #dce5ee}.saved-library h2{color:#173b59}.library-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.note-buttons button,.account-tab{border:1px solid #cbd8e5;border-radius:9px;padding:9px 13px;background:#fff;color:#173b59;cursor:pointer}.account-tab.active{background:#173b59;color:#fff}.hidden{display:none!important}@media(max-width:600px){.account-wrap{margin:22px auto}.account-card{padding:17px}}

<main class="account-wrap"><section class="account-card">
<div id="authArea"><h1>Minha conta</h1><p>Crie sua conta ou entre para guardar suas anotações bíblicas com segurança.</p>
<div class="account-actions"><button class="account-tab active" id="showLogin" type="button">Entrar</button><button class="account-tab" id="showSignup" type="button">Criar cadastro</button></div>
<form class="account-form" id="authForm"><label id="nameLabel" class="hidden">Nome<input id="fullName" autocomplete="name" maxlength="100"></label><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="Mínimo de 8 caracteres"></label><button class="btn btn-primary" id="authSubmit" type="submit">Entrar</button></form><div id="authMessage" role="status" aria-live="polite"></div></div>
<div id="userArea" class="hidden"><h1>Minhas anotações</h1><p id="userGreeting"></p><button id="signOut" type="button" class="account-tab">Sair da conta</button>
<form class="note-form" id="noteForm"><input type="hidden" id="noteId"><label>Título<input id="noteTitle" maxlength="160" placeholder="Ex.: Aprendizados sobre fé"></label><label>Referência bíblica (opcional)<input id="noteReference" maxlength="120" placeholder="Ex.: João 3:16"></label><label>Sua anotação<textarea id="noteContent" required maxlength="20000" placeholder="Escreva aqui sua reflexão, estudo ou oração..."></textarea></label><button class="btn btn-primary" type="submit" id="saveNote">Salvar anotação</button><button type="button" id="cancelEdit" class="account-tab hidden">Cancelar edição</button></form><div id="noteMessage" role="status" aria-live="polite"></div><div id="notesList" class="note-list"></div><section id="librarySection" class="saved-library"><h2>Minha biblioteca</h2><p>Seus versículos favoritos, esboços, estudos e conteúdos salvos.</p><div class="library-tabs"><button type="button" class="account-tab active" data-filter="all">Tudo</button><button type="button" class="account-tab" data-filter="favorite_verse">Favoritos</button><button type="button" class="account-tab" data-filter="outline">Esboços</button><button type="button" class="account-tab" data-filter="study">Estudos</button><button type="button" class="account-tab" data-filter="devotional">Devocionais</button><button type="button" class="account-tab" data-filter="sermon">Pregações</button></div><div id="savedLibrary" class="note-list"></div></section></div>
</section></main><script type="module" src="account.js?v=fix-auth-20261030"></script></body></html>
